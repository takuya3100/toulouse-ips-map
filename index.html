<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>トゥールーズ学校IPSマップ</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    YuGothic,
    Meiryo,
    sans-serif;
  color:#333;
  background:#f7f7f7;
}


/* -----------------------------
   ヘッダー
----------------------------- */

header{
  background:white;
  padding:18px 20px 14px;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0 0 6px;
  font-size:22px;
  line-height:1.4;
}

header p{
  margin:0;
  font-size:13px;
  line-height:1.7;
  color:#666;
}


/* -----------------------------
   レイアウト
----------------------------- */

.container{
  display:flex;
  height:calc(100vh - 101px);
  min-height:600px;
}

.sidebar{
  width:330px;
  background:#fafafa;
  border-right:1px solid #ddd;
  overflow-y:auto;
  padding:16px;
}

.section{
  margin-bottom:18px;
}

.label{
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}


/* -----------------------------
   セレクト
----------------------------- */

select{
  width:100%;
  padding:8px 10px;
  font-size:13px;
  border:1px solid #ccc;
  border-radius:6px;
  background:white;
}


/* -----------------------------
   年度情報
----------------------------- */

.year-info{
  font-size:11px;
  line-height:1.7;
  color:#666;
  margin-top:8px;
  padding:8px 9px;
  background:#fff;
  border:1px solid #eee;
  border-radius:7px;
}

.year-info strong{
  color:#333;
}


/* -----------------------------
   チェックボックス
----------------------------- */

.check-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
  font-size:13px;
}

.check-row input{
  margin:0;
}


/* -----------------------------
   IPSスライダー
----------------------------- */

.range-wrap{
  position:relative;
  height:36px;
  margin-top:8px;
}

.range-wrap input[type="range"]{
  position:absolute;
  left:0;
  top:8px;
  width:100%;
  pointer-events:none;
  appearance:none;
  background:transparent;
}

.range-wrap input[type="range"]::-webkit-slider-thumb{
  appearance:none;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#555;
  cursor:pointer;
  pointer-events:auto;
}

.range-wrap input[type="range"]::-moz-range-thumb{
  width:17px;
  height:17px;
  border-radius:50%;
  background:#555;
  border:0;
  cursor:pointer;
  pointer-events:auto;
}


/* -----------------------------
   数値入力
----------------------------- */

.number-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.number-row input{
  width:100%;
  padding:7px 8px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:13px;
}

.number-row span{
  color:#777;
  font-size:12px;
}


/* -----------------------------
   凡例
----------------------------- */

.legend{
  font-size:12px;
  line-height:1.8;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin:5px 0;
}

.legend-color{
  width:16px;
  height:16px;
  border-radius:50%;
  flex-shrink:0;
}


/* 公立・私立の形 */

.shape-circle{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1px solid #777;
  background:#ddd;
  flex-shrink:0;
}

.shape-square{
  width:14px;
  height:14px;
  border-radius:2px;
  border:1px solid #777;
  background:#ddd;
  flex-shrink:0;
}


/* -----------------------------
   注意書き
----------------------------- */

.note{
  font-size:11px;
  line-height:1.7;
  color:#777;
  padding:10px;
  background:#fff;
  border:1px solid #eee;
  border-radius:7px;
}


/* -----------------------------
   ステータス
----------------------------- */

.status{
  font-size:11px;
  color:#777;
  margin-top:12px;
}

.error{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#fff0f0;
  border:1px solid #e0aaaa;
  color:#9a3333;
  border-radius:7px;
  font-size:11px;
  line-height:1.6;
}


/* -----------------------------
   地図
----------------------------- */

#map{
  flex:1;
  min-width:0;
}


/* -----------------------------
   ポップアップ
----------------------------- */

.popup-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:7px;
}

.popup-row{
  font-size:12px;
  line-height:1.7;
}


/* -----------------------------
   スマホ
----------------------------- */

@media(max-width:800px){

  header h1{
    font-size:19px;
  }

  .container{
    display:block;
    height:auto;
  }

  .sidebar{
    width:100%;
    border-right:0;
    border-bottom:1px solid #ddd;
    max-height:none;
  }

  #map{
    width:100%;
    height:65vh;
    min-height:450px;
  }

}

</style>
</head>


<body>


<header>

  <h1>トゥールーズ学校IPSマップ</h1>

  <p>
    IPSとは、学校に通う子どもたちの家庭の社会的・経済的背景を表す指標です。
    数値が高いほど、平均的に社会的に恵まれた家庭の割合が高いことを示します。
  </p>

</header>


<div class="container">


  <!-- =========================
       サイドバー
  ========================== -->

  <aside class="sidebar">


    <!-- 年度 -->

    <div class="section">

      <div class="label">
        年度
      </div>

      <select id="year">
        <option value="all">
          読み込み中…
        </option>
      </select>

      <div
        id="yearInfo"
        class="year-info"
      >
        データを読み込んでいます。
      </div>

    </div>


    <!-- 学校種 -->

    <div class="section">

      <div class="label">
        学校種
      </div>


      <label class="check-row">

        <input
          type="checkbox"
          class="type"
          value="maternelle"
          checked
        >

        幼稚園（maternelle）

      </label>


      <label class="check-row">

        <input
          type="checkbox"
          class="type"
          value="elementaire"
          checked
        >

        小学校（élémentaire）

      </label>


      <label class="check-row">

        <input
          type="checkbox"
          class="type"
          value="college"
          checked
        >

        中学校（collège）

      </label>


      <label class="check-row">

        <input
          type="checkbox"
          class="type"
          value="lycee"
          checked
        >

        高校（lycée）

      </label>

    </div>


    <!-- 公立・私立 -->

    <div class="section">

      <div class="label">
        設置者
      </div>


      <label class="check-row">

        <input
          type="checkbox"
          id="public"
          checked
        >

        ● 公立

      </label>


      <label class="check-row">

        <input
          type="checkbox"
          id="private"
          checked
        >

        ■ 私立

      </label>

    </div>


    <!-- IPS -->

    <div class="section">

      <div class="label">
        IPS
      </div>


      <div class="range-wrap">

        <input
          type="range"
          id="rMin"
          min="50"
          max="160"
          value="50"
        >

        <input
          type="range"
          id="rMax"
          min="50"
          max="160"
          value="160"
        >

      </div>


      <div class="number-row">

        <input
          type="number"
          id="nMin"
          min="50"
          max="160"
          value="50"
        >

        <span>〜</span>

        <input
          type="number"
          id="nMax"
          min="50"
          max="160"
          value="160"
        >

      </div>

    </div>


    <!-- IPS凡例 -->

    <div class="section">

      <div class="label">
        IPSの目安
      </div>


      <div class="legend">


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#C9BCE5"
          ></span>

          79以下

        </div>


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#F6BE66"
          ></span>

          80〜94

        </div>


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#54B58D"
          ></span>

          95〜109

        </div>


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#4567C7"
          ></span>

          110〜124

        </div>


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#213E9B"
          ></span>

          125以上

        </div>


        <div class="legend-item">

          <span
            class="legend-color"
            style="background:#A7ADB5"
          ></span>

          IPSなし（幼稚園など）

        </div>


      </div>

    </div>


    <!-- マーカー凡例 -->

    <div class="section">

      <div class="label">
        マーカー
      </div>


      <div class="legend">


        <div class="legend-item">

          <span class="shape-circle"></span>

          公立

        </div>


        <div class="legend-item">

          <span class="shape-square"></span>

          私立

        </div>


      </div>

    </div>


    <!-- 注意 -->

    <div class="section">

      <div class="note">

        IPSは学校の教育の質や安全性を直接示す指標ではありません。
        学校に通う子どもたちの社会的・経済的背景を平均的に示す指標です。
        特に数ポイント程度の差は、過度に比較しないことをおすすめします。

      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      データを読み込んでいます…

    </div>


    <div
      id="error"
      class="error"
    ></div>


  </aside>


  <!-- 地図 -->

  <div id="map"></div>


</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =================================
   基本
================================= */

const $ = id =>
  document.getElementById(id);


let schools = [];

let markers = [];


/* =================================
   サンプルデータ
================================= */

const SAMPLE = [

  {
    uai:"SAMPLE001",
    name:"サンプル小学校",
    type:"elementaire",
    sector:"Public",
    ips:100,
    year:"2024-2025",
    lat:43.6047,
    lon:1.4442
  },

  {
    uai:"SAMPLE002",
    name:"サンプル中学校",
    type:"college",
    sector:"Public",
    ips:110,
    year:"2025-2026",
    lat:43.6100,
    lon:1.4500
  },

  {
    uai:"SAMPLE003",
    name:"サンプル高校",
    type:"lycee",
    sector:"Privé",
    ips:125,
    year:"2025-2026",
    lat:43.6000,
    lon:1.4350
  },

  {
    uai:"SAMPLE004",
    name:"サンプル幼稚園",
    type:"maternelle",
    sector:"Public",
    ips:null,
    year:"",
    lat:43.5980,
    lon:1.4480
  }

];


/* =================================
   地図
================================= */

const map =
  L.map("map");


map.setView(
  [43.6047,1.4442],
  12
);


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

  }

).addTo(map);


/* =================================
   HTMLエスケープ
================================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================
   設置者
================================= */

function normSector(value){

  const text =
    String(value || "")
      .trim()
      .toLowerCase();


  if(
    text.includes("priv")
  ){

    return "Privé";

  }


  return "Public";

}


/* =================================
   データ正規化
================================= */

function normalize(raw){

  return raw

    .map(x => ({

      uai:
        x.uai ||
        x.UAI ||
        "",


      name:
        x.name ||
        x.nom_de_l_etablissement ||
        x.Nom_etablissement ||
        "",


      type:
        x.type ||
        "elementaire",


      sector:
        normSector(
          x.sector ||
          x.secteur
        ),


      ips:
        x.ips === "" ||
        x.ips == null
          ? null
          : Number(x.ips),


      year:
        String(
          x.year ||
          x.rentree_scolaire ||
          ""
        ),


      lat:
        Number(
          x.lat ??
          x.latitude
        ),


      lon:
        Number(
          x.lon ??
          x.longitude
        )

    }))


    .filter(x =>

      x.name &&

      Number.isFinite(x.lat) &&

      Number.isFinite(x.lon)

    );

}


/* =================================
   IPSカラー
================================= */

function color(ips){


  /* IPSなし */

  if(ips == null){

    return "#A7ADB5";

  }


  /* 79以下 */

  if(ips <= 79){

    return "#C9BCE5";

  }


  /* 80〜94 */

  if(ips <= 94){

    return "#F6BE66";

  }


  /* 95〜109 */

  if(ips <= 109){

    return "#54B58D";

  }


  /* 110〜124 */

  if(ips <= 124){

    return "#4567C7";

  }


  /* 125以上 */

  return "#213E9B";

}


/* =================================
   ポップアップ
================================= */

function popup(s){


  const typeLabel = {

    maternelle:
      "幼稚園（maternelle）",

    elementaire:
      "小学校（élémentaire）",

    college:
      "中学校（collège）",

    lycee:
      "高校（lycée）"

  }[s.type] || s.type;


  const ipsText =
    s.ips == null
      ? "—"
      : s.ips;


  const yearText =
    s.year || "—";


  return `

    <div class="popup-title">

      ${escapeHtml(s.name)}

    </div>


    <div class="popup-row">

      <strong>学校種：</strong>

      ${escapeHtml(typeLabel)}

    </div>


    <div class="popup-row">

      <strong>設置者：</strong>

      ${escapeHtml(s.sector)}

    </div>


    <div class="popup-row">

      <strong>IPS：</strong>

      ${escapeHtml(ipsText)}

    </div>


    <div class="popup-row">

      <strong>年度：</strong>

      ${escapeHtml(yearText)}

    </div>

  `;

}


/* =================================
   年度情報
================================= */

function updateYearInfo(){


  const selected =
    $("year").value;


  /* すべて */

  if(
    selected === "all"
  ){

    $("yearInfo").innerHTML =
      "年度を選択すると、学校種ごとのIPSデータ状況を表示します。";

    return;

  }


  const types = [

    [
      "elementaire",
      "小学校（élémentaire）"
    ],

    [
      "college",
      "中学校（collège）"
    ],

    [
      "lycee",
      "高校（lycée）"
    ]

  ];


  const lines =
    types.map(
      ([type,label]) => {


        const hasData =
          schools.some(
            s =>
              s.type === type &&
              s.year === selected
          );


        if(hasData){

          return (
            `・${label}：IPSあり`
          );

        }


        const latest =
          [

            ...new Set(

              schools

                .filter(
                  s =>
                    s.type === type &&
                    s.year
                )

                .map(
                  s => s.year
                )

            )

          ]

          .sort(
            (a,b) =>
              b.localeCompare(a)
          )[0];


        return (

          `・${label}：IPSデータなし` +

          (

            latest

              ? `（最新掲載年度：${latest}）`

              : ""

          )

        );

      }

    );


  $("yearInfo").innerHTML =

    `<strong>${escapeHtml(selected)}年度</strong><br>` +

    lines.join("<br>") +

    "<br>・幼稚園（maternelle）：表示（IPSなし）";

}


/* =================================
   年度セレクト
================================= */

function setYears(){


  const years =

    [

      ...new Set(

        schools

          .map(
            s => s.year
          )

          .filter(Boolean)

      )

    ]

    .sort(

      (a,b) =>
        b.localeCompare(a)

    );


  $("year").innerHTML =

    '<option value="all">すべて</option>' +

    years

      .map(

        y =>

          `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`

      )

      .join("");


  if(years.length){

    $("year").value =
      years[0];

  }

}


/* =================================
   地図描画
================================= */

function render(){


  /* 既存マーカーを削除 */

  markers.forEach(
    m =>
      map.removeLayer(m)
  );


  markers = [];


  const year =
    $("year").value;


  const types =

    [

      ...document.querySelectorAll(
        ".type:checked"
      )

    ]

    .map(
      x => x.value
    );


  const min =
    Number(
      $("nMin").value
    );


  const max =
    Number(
      $("nMax").value
    );


  const pub =
    $("public").checked;


  const pri =
    $("private").checked;


  schools

    .filter(s => {


      /*
       * 幼稚園はIPS年度データを持たないため、
       * 年度を指定しても表示する。
       */

      if(

        year !== "all" &&

        s.type !== "maternelle" &&

        s.year !== year

      ){

        return false;

      }


      /* 学校種 */

      if(
        !types.includes(s.type)
      ){

        return false;

      }


      /* 公立 */

      if(

        s.sector === "Public" &&

        !pub

      ){

        return false;

      }


      /* 私立 */

      if(

        s.sector === "Privé" &&

        !pri

      ){

        return false;

      }


      /*
       * IPSがある学校だけ
       * IPS範囲フィルターを適用。
       *
       * IPSなしの幼稚園などは
       * そのまま表示する。
       */

      if(

        s.ips != null &&

        (

          s.ips < min ||

          s.ips > max

        )

      ){

        return false;

      }


      return true;

    })


    .forEach(s => {


      const isPriv =
        s.sector === "Privé";


      const marker =

        L.marker(

          [

            s.lat,

            s.lon

          ],

          {

            icon:

              L.divIcon({

                className:"",

                html:

                  `

                  <div

                    style="

                      width:15px;

                      height:15px;

                      background:${color(s.ips)};

                      border:2px solid white;

                      box-shadow:0 0 2px #555;

                      ${
                        isPriv

                          ? "border-radius:2px;"

                          : "border-radius:50%;"

                      }

                    "

                  ></div>

                  `,

                iconSize:
                  [15,15],

                iconAnchor:
                  [7.5,7.5]

              })

          }

        )

        .addTo(map)

        .bindPopup(
          popup(s)
        );


      markers.push(marker);

    });


  /* ステータス */

  $("status").textContent =

    `表示中：${markers.length}校 / データ：${schools.length}校`;


  /*
   * 年度情報を更新
   *
   * ここは必ず render() の中。
   */

  updateYearInfo();

}


/* =================================
   スライダー → 数値
================================= */

function syncFromRange(){


  let min =
    Number(
      $("rMin").value
    );


  let max =
    Number(
      $("rMax").value
    );


  if(min > max){


    if(

      document.activeElement ===
      $("rMin")

    ){

      min = max;

    }else{

      max = min;

    }

  }


  $("nMin").value =
    min;

  $("nMax").value =
    max;


  render();

}


/* =================================
   数値 → スライダー
================================= */

function syncFromNumber(){


  let min =
    Number(
      $("nMin").value
    );


  let max =
    Number(
      $("nMax").value
    );


  if(
    !Number.isFinite(min)
  ){

    min = 50;

  }


  if(
    !Number.isFinite(max)
  ){

    max = 160;

  }


  min =

    Math.max(

      50,

      Math.min(
        160,
        min
      )

    );


  max =

    Math.max(

      50,

      Math.min(
        160,
        max
      )

    );


  if(min > max){


    if(

      document.activeElement ===
      $("nMin")

    ){

      min = max;

    }else{

      max = min;

    }

  }


  $("nMin").value =
    min;

  $("nMax").value =
    max;


  $("rMin").value =
    min;

  $("rMax").value =
    max;


  render();

}


/* =================================
   イベント
================================= */

$("rMin")
  .addEventListener(
    "input",
    syncFromRange
  );


$("rMax")
  .addEventListener(
    "input",
    syncFromRange
  );


$("nMin")
  .addEventListener(
    "change",
    syncFromNumber
  );


$("nMax")
  .addEventListener(
    "change",
    syncFromNumber
  );


$("year")
  .addEventListener(
    "change",
    render
  );


$("public")
  .addEventListener(
    "change",
    render
  );


$("private")
  .addEventListener(
    "change",
    render
  );


document
  .querySelectorAll(".type")
  .forEach(

    x =>

      x.addEventListener(
        "change",
        render
      )

  );


/* =================================
   JSON読み込み
================================= */

async function loadData(){


  try{


    const r =

      await fetch(

        "data/schools.json",

        {
          cache:"no-store"
        }

      );


    if(!r.ok){

      throw new Error(
        "HTTP " + r.status
      );

    }


    const d =
      await r.json();


    if(

      !Array.isArray(d) ||

      !d.length

    ){

      throw new Error(
        "JSONに学校データがありません"
      );

    }


    schools =
      normalize(d);


    if(!schools.length){

      throw new Error(
        "利用できる学校データがありません"
      );

    }


    /* 年度をセット */

    setYears();


    /* 地図を描画 */

    render();


  }


  catch(e){


    console.error(
      "schools.jsonの読み込みに失敗しました：",
      e
    );


    /*
     * JSONが読めない場合でも
     * ページそのものは表示する。
     */

    schools =
      SAMPLE;


    setYears();

    render();


    $("error").style.display =
      "block";


    $("error").textContent =

      "data/schools.jsonを読み込めなかったため、現在は動作確認用サンプルデータを表示しています。GitHub Pagesではindex.htmlとdata/schools.jsonが同じサイト内にあることを確認してください。";

  }

}


/* =================================
   起動
================================= */

loadData();


</script>

</html>
