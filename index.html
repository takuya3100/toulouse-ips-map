<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トゥールーズの住まい探しデータマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;color:#333;background:#f7f7f7}
header{background:#fff;padding:18px 20px 14px;border-bottom:1px solid #ddd}
header h1{margin:0 0 6px;font-size:22px;line-height:1.4}
header p{margin:0;font-size:13px;line-height:1.7;color:#666}
.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid #ddd;overflow-x:auto}
.tab{border:0;background:#fff;padding:12px 18px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:#555}
.tab.active{font-weight:bold;color:#222;border-bottom-color:#555}
.container{display:grid;grid-template-columns:360px minmax(0,1fr);width:100%;height:calc(100vh - 145px);min-height:600px;min-width:0}
.sidebar{width:360px;background:#fafafa;border-right:1px solid #ddd;overflow-y:auto;padding:16px}
.section{margin-bottom:18px}.label{font-size:13px;font-weight:bold;margin-bottom:8px}
select{width:100%;padding:8px 10px;font-size:13px;border:1px solid #ccc;border-radius:6px;background:#fff}
.check-row{display:flex;align-items:center;gap:7px;margin:7px 0;font-size:13px}.check-row input{margin:0}
.note,.year-info{font-size:11px;line-height:1.7;color:#777;padding:10px;background:#fff;border:1px solid #eee;border-radius:7px}
.status{font-size:11px;color:#777;margin-top:12px}
.error{display:none;margin-top:10px;padding:10px;background:#fff0f0;border:1px solid #e0aaaa;color:#9a3333;border-radius:7px;font-size:11px;line-height:1.6}
.legend{font-size:11px;line-height:1.8}.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0}.legend-color{width:18px;height:12px;border-radius:3px;flex-shrink:0}
#map{width:100%;height:100%;min-width:0;min-height:520px}\n#crimePanel{width:100%;height:100%;min-width:0;min-height:520px;overflow:hidden}
.leaflet-container{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif}
.popup-title{font-weight:bold;font-size:14px;margin-bottom:7px}.popup-row{font-size:12px;line-height:1.7}
.metric-desc{font-size:11px;color:#666;line-height:1.6;margin-top:7px}
.legend-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:11px 12px}
.legend-title{font-size:12px;font-weight:bold;margin-bottom:7px}
.gradient-bar{height:14px;border-radius:7px;background:linear-gradient(to right,#eff6ff,#bfdbfe,#60a5fa,#2563eb,#1e40af);border:1px solid #dbe3ec}
.legend-labels{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#666;margin-top:5px}
.legend-note{font-size:10px;color:#777;line-height:1.5;margin-top:6px}
.source{font-size:10px;color:#888;line-height:1.7}
.source a{color:#526f8f;text-decoration:underline}
.popup-main-value{font-size:20px;font-weight:bold;color:#2563eb;margin:3px 0 7px}
.popup-sub{font-size:10px;color:#777}
.popup-section{border-top:1px solid #eee;margin-top:8px;padding-top:8px}
.popup-link{font-size:11px;color:#526f8f}

.iris-boundary{fill-opacity:.72;stroke:#777;stroke-width:1}
.range-wrap{position:relative;height:30px;margin:8px 2px 2px}
.range-track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(to right,#E84A5F 0%,#E84A5F 26.36%,#F58A2A 26.36%,#F58A2A 40%,#F6C445 40%,#F6C445 53.64%,#8CCB5E 53.64%,#8CCB5E 67.27%,#238B57 67.27%,#238B57 100%)}
.range-wrap input[type=range]{position:absolute;left:0;top:4px;width:100%;height:22px;margin:0;background:transparent;pointer-events:none;appearance:none;-webkit-appearance:none}
.range-wrap input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #555;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
.range-wrap input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #555;box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
.range-values{display:flex;justify-content:space-between;font-size:11px;color:#555}
.number-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.number-row input{width:78px;padding:6px 7px;border:1px solid #ccc;border-radius:5px;font-size:12px}
.definition-box{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:11px 12px;font-size:11px;line-height:1.75}
.definition-box strong{font-size:12px}
.source-box{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:11px 12px;font-size:10.5px;line-height:1.7}
.source-box a{color:#426b95;text-decoration:underline}

@media(max-width:800px){
 body{overflow-x:hidden}
 header{padding:14px 14px 12px}
 header h1{font-size:19px;line-height:1.35}
 header p{font-size:12px;line-height:1.6}
 .tabs{display:flex;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
 .tab{flex:0 0 auto;font-size:13px;padding:10px 12px}
 .container{display:block;width:100%;height:auto;min-height:0}
 .sidebar{width:100%;box-sizing:border-box;border-right:0;border-bottom:1px solid #ddd;max-height:none}
 #map,#crimePanel{width:100%;height:62vh;min-height:430px;display:block}
 .leaflet-control{font-size:12px}
 .section{padding:11px 12px}
 .popup-main-value{font-size:20px}
}
.crime-gradient{
background:linear-gradient(to right,#f1f5f9,#dbeafe,#93c5fd,#60a5fa,#3b82f6,#2563eb,#1d4ed8,#1e40af,#1e3a8a,#172554)!important;
}
</style>
</head>
<body>
<header>
<h1>トゥールーズの住まい探しデータマップ</h1>
<p>フランスの公的データを、住まい探しに使いやすいよう4つの視点から地図で見られるようにしています。データの解釈や判断は、利用する方ご自身で行ってください。</p>
</header>

<nav class="tabs">
<button class="tab active" data-tab="schools">🏫 学校・IPS</button>
<button class="tab" data-tab="crime">🔐 住宅侵入窃盗</button>
<button class="tab" data-tab="community">👨‍👩‍👧 住民・世帯構成</button>
<button class="tab" data-tab="housing">🏠 住宅・所得</button>
</nav>

<div class="container">
<aside class="sidebar" id="sidebar"></aside>
<div id="map"></div>
<div id="crimePanel" style="display:none">
  <iframe
    id="crimeFrame"
    src="https://ssmsi.shinyapps.io/cambriolageslogementsechelleinfracommunale/"
    title="SSMSI 住宅侵入窃盗の都市内地図"
    loading="lazy"
    style="width:100%;height:100%;min-height:680px;border:0;background:#fff">
  </iframe>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
let schools=[],schoolMarkers=[],irisLayer=null,currentTab="schools";
let communityData=null,housingData=null,incomeData=null,crimeData=null,crimeLayer=null;

const SAMPLE=[
{uai:"SAMPLE001",name:"サンプル小学校",type:"elementaire",sector:"Public",ips:100,year:"2024-2025",lat:43.6047,lon:1.4442},
{uai:"SAMPLE002",name:"サンプル中学校",type:"college",sector:"Public",ips:110,year:"2025-2026",lat:43.6100,lon:1.4500},
{uai:"SAMPLE003",name:"サンプル高校",type:"lycee",sector:"Privé",ips:125,year:"2025-2026",lat:43.6000,lon:1.4350},
{uai:"SAMPLE004",name:"サンプル幼稚園",type:"maternelle",sector:"Public",ips:null,year:"",lat:43.5980,lon:1.4480}
];

const map=L.map("map").setView([43.6047,1.4442],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function normSector(v){return String(v||"").trim().toLowerCase().includes("priv")?"Privé":"Public"}
function normalize(raw){return raw.map(x=>({uai:x.uai||x.UAI||"",name:x.name||x.nom_de_l_etablissement||x.Nom_etablissement||"",type:x.type||"elementaire",sector:normSector(x.sector||x.secteur),ips:x.ips===""||x.ips==null?null:Number(x.ips),year:String(x.year||x.rentree_scolaire||""),lat:Number(x.lat??x.latitude),lon:Number(x.lon??x.longitude)})).filter(x=>x.name&&Number.isFinite(x.lat)&&Number.isFinite(x.lon))}
function schoolColor(ips){if(ips==null)return"#A7ADB5";if(ips<=79)return"#E84A5F";if(ips<=94)return"#F58A2A";if(ips<=109)return"#F6C445";if(ips<=124)return"#8CCB5E";return"#238B57"}

function clearMap(){
 schoolMarkers.forEach(m=>map.removeLayer(m)); schoolMarkers=[];
 if(irisLayer){map.removeLayer(irisLayer);irisLayer=null}
 if(crimeLayer){map.removeLayer(crimeLayer);crimeLayer=null}
}
function setSidebar(html){$("sidebar").innerHTML=html}
function setStatus(text){const el=$("status");if(el)el.textContent=text}
function showError(text){const el=$("error");if(el){el.style.display="block";el.textContent=text}}

function renderSchoolSidebar(){
setSidebar(`
<div class="section"><div class="label">年度</div><select id="year"></select><div id="yearInfo" class="year-info">データを読み込んでいます。</div></div>
<div class="section"><div class="label">学校種</div>
<label class="check-row"><input type="checkbox" id="allTypes" checked>すべて選択</label>
<label class="check-row"><input type="checkbox" class="type" value="maternelle" checked>幼稚園（maternelle）</label>
<label class="check-row"><input type="checkbox" class="type" value="elementaire" checked>小学校（élémentaire）</label>
<label class="check-row"><input type="checkbox" class="type" value="college" checked>中学校（collège）</label>
<label class="check-row"><input type="checkbox" class="type" value="lycee" checked>高校（lycée）</label></div>
<div class="section"><div class="label">設置者</div>
<label class="check-row"><input type="checkbox" id="public" checked>● 公立</label>
<label class="check-row"><input type="checkbox" id="private" checked>■ 私立</label></div>
<div class="section"><div class="label">IPSの範囲</div>
<div style="font-size:11px;color:#777;line-height:1.6">スライダーまたは数値入力でIPSの範囲を指定できます。</div>
<div class="range-wrap">
<div class="range-track"></div>
<input type="range" id="ipsMinRange" min="50" max="160" value="50">
<input type="range" id="ipsMaxRange" min="50" max="160" value="160">
</div>
<div class="range-values"><span>50</span><span>160</span></div>
<div class="number-row"><input type="number" id="nMin" min="50" max="160" value="50"><span>〜</span><input type="number" id="nMax" min="50" max="160" value="160"></div></div>
<div class="section"><div class="label">IPSとは</div>
<div class="definition-box">
<strong>IPS（Indice de position sociale）</strong>は、保護者の職業・社会的カテゴリー（PCS）をもとに、児童・生徒の社会経済・文化的背景を把握するための統計指標です。<br><br>
学校に通う子どもたちの社会的構成を、学校単位で表すために使われています。数値が高いほど、平均的に社会的に有利な背景を持つ子どもが多いことを示します。<br><br>
※IPSそのものが、世帯収入・学力・教育の質・安全性を直接測定する指標ではありません。
</div></div>
<div class="section"><div class="label">IPSの区分</div><div class="legend">
<div class="legend-item"><span class="legend-color" style="background:#E84A5F"></span>79以下</div>
<div class="legend-item"><span class="legend-color" style="background:#F58A2A"></span>80〜94</div>
<div class="legend-item"><span class="legend-color" style="background:#F6C445"></span>95〜109</div>
<div class="legend-item"><span class="legend-color" style="background:#8CCB5E"></span>110〜124</div>
<div class="legend-item"><span class="legend-color" style="background:#238B57"></span>125以上</div>
<div class="legend-item"><span class="legend-color" style="background:#A7ADB5"></span>IPSなし（幼稚園など）</div>
</div></div>
<div class="section"><div class="label">マーカー</div><div class="legend">● 公立　　■ 私立</div></div>
<div class="section"><div class="note"><strong>データについて</strong><br>
小学校（élémentaire）のIPSについては、2025-2026年度のデータが現在公開されていないため、表示できる最新年度は2024-2025年度です。<br><br>
対象：Toulouse Métropoleの37自治体
</div></div>
<div class="section"><div class="source-box"><strong>データの出典</strong><br>
・<a href="https://data.education.gouv.fr/explore/dataset/fr-en-annuaire-education/information/" target="_blank" rel="noopener">教育省「Annuaire de l'éducation」</a>（学校情報）<br>
・<a href="https://data.education.gouv.fr/explore/dataset/fr-en-ips-ecoles-ap2022/information/" target="_blank" rel="noopener">教育省「Indices de position sociale des écoles」</a>（小学校IPS）<br>
・<a href="https://data.education.gouv.fr/explore/dataset/fr-en-ips-colleges-ap2023/information/" target="_blank" rel="noopener">教育省「Indices de position sociale des collèges」</a>（中学校IPS）<br>
・<a href="https://data.education.gouv.fr/explore/dataset/fr-en-ips-lycees-ap2023/information/" target="_blank" rel="noopener">教育省「Indices de position sociale des lycées」</a>（高校IPS）<br>
・<a href="https://www.education.gouv.fr/depp/l-indice-de-position-sociale-ips-357755" target="_blank" rel="noopener">教育省「L'indice de position sociale (IPS)」</a>（IPSの説明）
</div></div>
<div id="status" class="status"></div><div id="error" class="error"></div>`);
setSchoolControls();
}

function setSchoolControls(){
const years=[...new Set(schools.map(s=>s.year).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
$("year").innerHTML='<option value="all">すべて</option>'+years.map(y=>`<option>${escapeHtml(y)}</option>`).join("");
if(years.length)$("year").value=years[0];
["year","public","private"].forEach(id=>$(id)?.addEventListener("change",renderSchools));
document.querySelectorAll(".type").forEach(x=>x.addEventListener("change",()=>{
const all=[...document.querySelectorAll(".type")];$("allTypes").checked=all.every(y=>y.checked);renderSchools()
}));
$("allTypes").addEventListener("change",()=>{
document.querySelectorAll(".type").forEach(x=>x.checked=$("allTypes").checked);renderSchools()
});

const minRange=$("ipsMinRange"),maxRange=$("ipsMaxRange"),minInput=$("nMin"),maxInput=$("nMax");
function syncFromRange(){
let min=Number(minRange.value),max=Number(maxRange.value);
if(min>max){if(document.activeElement===minRange)max=min;else min=max;}
minRange.value=min;maxRange.value=max;minInput.value=min;maxInput.value=max;renderSchools();
}
function syncFromInput(){
let min=Math.max(50,Math.min(160,Number(minInput.value)||50));
let max=Math.max(50,Math.min(160,Number(maxInput.value)||160));
if(min>max){if(document.activeElement===minInput)max=min;else min=max;}
minInput.value=min;maxInput.value=max;minRange.value=min;maxRange.value=max;renderSchools();
}
minRange.addEventListener("input",syncFromRange);maxRange.addEventListener("input",syncFromRange);
minInput.addEventListener("change",syncFromInput);maxInput.addEventListener("change",syncFromInput);
renderSchools();
}

function renderSchools(){
clearMap();
const year=$("year")?.value||"all",types=[...document.querySelectorAll(".type:checked")].map(x=>x.value);
const min=Number($("nMin")?.value||50),max=Number($("nMax")?.value||160);
const pub=$("public")?.checked!==false,pri=$("private")?.checked!==false;
schools.filter(s=>{
if(year!=="all"&&s.type!=="maternelle"&&s.year!==year)return false;
if(!types.includes(s.type))return false;
if(s.sector==="Public"&&!pub)return false;if(s.sector==="Privé"&&!pri)return false;
if(s.ips!=null&&(s.ips<min||s.ips>max))return false;return true;
}).forEach(s=>{
const priv=s.sector==="Privé";
const marker=L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<div style="width:15px;height:15px;background:${schoolColor(s.ips)};border:2px solid white;box-shadow:0 0 2px #555;${priv?"border-radius:2px":"border-radius:50%"}"></div>`,iconSize:[15,15],iconAnchor:[7.5,7.5]})}).addTo(map);
marker.bindPopup(`<div class="popup-title">${escapeHtml(s.name)}</div><div class="popup-row"><strong>学校種：</strong>${escapeHtml({maternelle:"幼稚園（maternelle）",elementaire:"小学校（élémentaire）",college:"中学校（collège）",lycee:"高校（lycée）"}[s.type]||s.type)}</div><div class="popup-row"><strong>設置者：</strong>${escapeHtml(s.sector)}</div><div class="popup-row"><strong>IPS：</strong>${s.ips==null?"—":s.ips}</div><div class="popup-row"><strong>年度：</strong>${escapeHtml(s.year||"—")}</div>`);
schoolMarkers.push(marker);
});
if($("status"))$("status").textContent=`表示中：${schoolMarkers.length}校 / データ：${schools.length}校`;
if($("yearInfo"))$("yearInfo").innerHTML=year==="all"?"年度を選択すると、その年度の学校データを表示します。<br><br>※小学校（élémentaire）のIPSは2025-2026年度のデータが公開されていないため、最新は2024-2025年度です。":`<strong>${escapeHtml(year)}年度</strong><br>・幼稚園（maternelle）：学校位置を表示（IPSなし）<br>・小学校（élémentaire）：${year==="2025-2026"?"IPSデータは未公開。最新は2024-2025年度です。":"IPSデータを表示"}<br>・中学校（collège）：IPSデータを表示<br>・高校（lycée）：IPSデータを表示`;
}

const COMMUNITY_METRICS=[
["age_0_14","0〜14歳","総人口に占める0〜14歳人口の割合","2022年","そのIRISに住む人口のうち、0〜14歳の人が占める割合です。"],
["age_15_29","15〜29歳","総人口に占める15〜29歳人口の割合","2022年","そのIRISに住む人口のうち、15〜29歳の人が占める割合です。"],
["age_30_44","30〜44歳","総人口に占める30〜44歳人口の割合","2022年","そのIRISに住む人口のうち、30〜44歳の人が占める割合です。"],
["age_45_59","45〜59歳","総人口に占める45〜59歳人口の割合","2022年","そのIRISに住む人口のうち、45〜59歳の人が占める割合です。"],
["age_60_74","60〜74歳","総人口に占める60〜74歳人口の割合","2022年","そのIRISに住む人口のうち、60〜74歳の人が占める割合です。"],
["age_75_plus","75歳以上","総人口に占める75歳以上人口の割合","2022年","そのIRISに住む人口のうち、75歳以上の人が占める割合です。"],
["single_household","単身世帯","総世帯数に占める単身世帯の割合","2022年","そのIRISの世帯のうち、1人で暮らす世帯が占める割合です。"],
["child_household","子どものいる世帯","総世帯数に占める子どものいる世帯の割合","2022年","そのIRISの世帯のうち、子どものいる世帯が占める割合です。子どものいるカップル世帯と、ひとり親世帯を合わせて算出しています。"],
["single_parent_household","ひとり親世帯","総世帯数に占めるひとり親世帯の割合","2022年","そのIRISの世帯のうち、ひとり親世帯が占める割合です。"]
];
const HOUSING_METRICS=[
["living_standard","生活水準","世帯の可処分所得を消費単位（UC）で調整した中央値","2021年","世帯の可処分所得を消費単位（UC）で割って算出する「niveau de vie（生活水準）」の中央値です。"],
["poverty_rate","貧困率","貧困線を下回る人の割合","2021年","Filosofiにおける貧困率です。貧困線はフランス本土の所得中央値の60%に設定されています。"],
["old_housing","1990年以前に建てられた住宅","主たる住居に占める割合","2022年","主たる住居のうち、1990年以前に建てられた住宅が占める割合です。"],
["house_rate","戸建て率","主たる住居に占める戸建て住宅の割合","2022年","主たる住居のうち、戸建て住宅が占める割合です。"],
["owner_rate","持ち家率","主たる住居に占める持ち家の割合","2022年","主たる住居のうち、所有者が居住している住宅が占める割合です。"],
["hlm_rate","社会住宅（HLM）率","主たる住居に占めるHLM住宅の割合","2022年","主たる住居のうち、HLM（Habitation à loyer modéré）に分類される住宅が占める割合です。"]
];

function metricSidebar(kind){
const list=kind==="community"?COMMUNITY_METRICS:HOUSING_METRICS;
const title=kind==="community"?"👨‍👩‍👧 住民・世帯構成":"🏠 住宅・所得";
const sourceHtml=kind==="community"?`
<div><strong>INSEE 人口統計（2022年）</strong><br><a href="https://www.insee.fr/fr/statistiques/8647014" target="_blank" rel="noopener">人口構造・人口推移（IRIS）</a></div>
<div style="margin-top:7px"><strong>INSEE 世帯・家族統計（2022年）</strong><br><a href="https://www.insee.fr/fr/statistiques/8647008" target="_blank" rel="noopener">カップル・家族・世帯（IRIS）</a></div>
<div style="margin-top:7px"><strong>IRIS境界（INSEE / IGN）</strong><br><a href="https://www.data.gouv.fr/datasets/contours-iris-r-2" target="_blank" rel="noopener">Contours... IRIS®</a></div>`:`
<div><strong>INSEE 住宅統計（2022年）</strong><br><a href="https://www.insee.fr/fr/statistiques/8647012" target="_blank" rel="noopener">住宅（IRIS）</a></div>
<div style="margin-top:7px"><strong>INSEE Filosofi 所得統計（2021年）</strong><br><a href="https://www.insee.fr/fr/statistiques/8229323" target="_blank" rel="noopener">Filosofi（IRIS）</a></div>
<div style="margin-top:7px"><strong>IRIS境界（INSEE / IGN）</strong><br><a href="https://www.data.gouv.fr/datasets/contours-iris-r-2" target="_blank" rel="noopener">Contours... IRIS®</a></div>`;
setSidebar(`<div class="section"><div class="label">${title}</div>
<select id="metric">${list.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("")}</select>
<div id="metricDesc" class="metric-desc"></div></div>
<div class="section"><div class="definition-box"><strong>このタブについて</strong><br>
このマップは、フランスの公的統計をIRIS単位で地図上に表示したものです。色が濃いほど、選択した指標の値が高い地域です。<br><br>
${kind==="community"?"年齢は総人口、世帯指標は総世帯数を分母としています。":"住宅指標は主たる住居を基本とし、生活水準・貧困率はFilosofiの定義に基づきます。"}<br><br>
データの解釈や住む場所の判断は、このデータを見る方ご自身で行ってください。
</div></div>
<div class="section"><div id="legend" class="legend-card"></div></div>
<div class="section"><div id="metricDefinition" class="definition-box"></div></div>
<div class="section"><div class="source-box"><strong>データの出典</strong><br>${sourceHtml}<br><br>
※統計値の年度は指標によって異なります。各指標の説明と凡例をご確認ください。<br>
※色分けは地域差を見やすくするための相対的な表示です。色の濃淡そのものに「良い・悪い」の意味はありません。
</div></div>
<div id="status" class="status"></div><div id="error" class="error"></div>`);
$("metric").addEventListener("change",()=>renderIris(kind));
renderIris(kind);
}

function metricValues(kind){
if(kind==="community")return communityData?.features||[];
return [...(housingData?.features||[]),...(incomeData?.features||[])];
}

function getMetricDef(kind,key){
return (kind==="community"?COMMUNITY_METRICS:HOUSING_METRICS).find(x=>x[0]===key);
}
function metricValue(feature,key){const v=feature.properties?.[key];return typeof v==="number"&&Number.isFinite(v)?v:null}
function formatMetric(kind,key,v){
if(v==null)return"データなし";
if(key==="living_standard")return Math.round(v).toLocaleString("fr-FR")+" €/年・UC";
return v.toFixed(1)+" %";
}
function palette(t){
const stops=["#f1f5f9","#dbeafe","#93c5fd","#3b82f6","#1d4ed8"];
const i=Math.max(0,Math.min(4,Math.floor(t*5)));return stops[Math.min(i,4)];
}
function renderIris(kind){
clearMap();
const key=$("metric").value, def=getMetricDef(kind,key);
$("metricDesc").textContent=`${def[2]}／${def[3]}`;
let features;
if(kind==="community")features=communityData?.features||[];
else{
features=(key==="living_standard"||key==="poverty_rate")?(incomeData?.features||[]):(housingData?.features||[]);
}
const vals=features.map(f=>metricValue(f,key)).filter(v=>v!=null);
if(!features.length){showError("INSEEデータをまだ読み込めません。GitHub Actionsの実行後に再読み込みしてください。");return}
if(!vals.length){showError("この指標の値がありません。");return}
const min=Math.min(...vals),max=Math.max(...vals),mid=min+(max-min)/2;
const style=f=>{const v=metricValue(f,key);const t=v==null?0.03:(max===min?0.5:(v-min)/(max-min));return{color:"#777",weight:1,fillColor:v==null?"#e5e7eb":palette(t),fillOpacity:.72}};
const legendValue=v=>formatMetric(kind,key,v);
$("legend").innerHTML=`<div class="legend-title">${escapeHtml(def[1])}</div><div class="gradient-bar"></div><div class="legend-labels"><span>${legendValue(min)}</span><span>${legendValue(mid)}</span><span>${legendValue(max)}</span></div><div class="legend-note">低い ← 地域差 → 高い<br>灰色：データなし</div>`;
$("metricDefinition").innerHTML=`<strong>${escapeHtml(def[1])}の意味</strong><br>${escapeHtml(def[4])}`;
irisLayer=L.geoJSON({type:"FeatureCollection",features},{style, onEachFeature:(f,l)=>{
const p=f.properties,v=metricValue(f,key);
const value=v==null?"データなし":formatMetric(kind,key,v);
l.bindPopup(`<div class="popup-title">${escapeHtml(p.name||p.iris)}</div><div class="popup-row">${escapeHtml(def[1])}</div><div class="popup-main-value">${escapeHtml(value)}</div><div class="popup-sub">${escapeHtml(def[2])}・${escapeHtml(def[3])}</div><div class="popup-section">${escapeHtml(def[4])}</div><div class="popup-section"><div class="popup-row"><strong>IRIS：</strong>${escapeHtml(p.iris)}</div><div class="popup-link">この色は、選択した指標の地域内での相対的な値を示しています。</div></div>`);
l.bindTooltip(`${escapeHtml(p.name||p.iris)}：${escapeHtml(value)}`,{sticky:true});
}}).addTo(map);
const bounds=irisLayer.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.04));
$("status").textContent=`表示中：${features.length}地域 / 値あり：${vals.length}地域`;
}

async function loadJson(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status+" "+url);return r.json()}
async function loadSchools(){
try{const d=await loadJson("data/schools.json");schools=normalize(d)}catch(e){console.error(e);schools=SAMPLE;showError("学校データを読み込めなかったため、動作確認用サンプルを表示しています。")}
}
async function loadIris(){
try{communityData=await loadJson("data/iris_community.json")}catch(e){console.error(e)}
try{housingData=await loadJson("data/iris_housing.json")}catch(e){console.error(e)}
try{incomeData=await loadJson("data/iris_income.json")}catch(e){console.error(e)}
}
async function switchTab(tab){
  currentTab=tab;
  clearMap();

  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active",b.dataset.tab===tab)
  );

  const mapEl=$("map");
  const crimePanel=$("crimePanel");

  if(tab==="crime"){
    mapEl.style.display="none";
    crimePanel.style.display="block";

    setSidebar(`
      <div class="section">
        <div class="label">🔐 住宅侵入窃盗</div>
        <div class="note">
          フランス内務省SSMSIが公開している<strong>公式の地図をそのまま表示</strong>しています。<br><br>
          住宅侵入窃盗および未遂の都市内分布を確認できます。
        </div>
      </div>
      <div class="section">
        <div class="label">公式データについて</div>
        <div class="note">
          このタブでは、当サイトでデータを再加工・再描画していません。SSMSIの公式サイトを表示しています。<br><br>
          表示内容・区分・地図の仕様は、SSMSI公式サイトに準拠します。
        </div>
      </div>
      <div class="section">
        <div class="label">出典</div>
        <div class="note">
          <a href="https://www.interieur.gouv.fr/Interstats/Datavisualisation/Cambriolages-de-logements-a-l-echelle-infracommunale" target="_blank" rel="noopener">フランス内務省 SSMSI：住宅侵入窃盗の都市内地図</a><br><br>
          <a href="https://www.data.gouv.fr/datasets/fonds-des-cartes-de-chaleur-des-taux-de-cambriolages-et-tentatives-de-cambriolages-de-logements-enregistres-par-la-police-et-la-gendarmerie-nationales" target="_blank" rel="noopener">data.gouv.fr：公式データセット</a>
        </div>
      </div>
      <div class="section">
        <div class="note small">
          このマップは公的データを見やすく表示することを目的としています。データの解釈や住む場所の判断は、利用者ご自身で行ってください。
        </div>
      </div>
    `);

    setStatus("SSMSI公式地図を表示しています。");
    return;
  }

  mapEl.style.display="block";
  crimePanel.style.display="none";

  if(tab==="schools") renderSchoolSidebar();
  if(tab==="community") metricSidebar("community");
  if(tab==="housing") metricSidebar("housing");

  setTimeout(()=>map.invalidateSize(),50);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

(async()=>{
await loadSchools();await loadIris();$("map").style.display="block";$("crimePanel").style.display="none";switchTab("schools");
setTimeout(()=>map.invalidateSize(),150);
})();
</script>
</body>
</html>
