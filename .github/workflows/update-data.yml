name: Update Toulouse map data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch official education data
        run: python scripts/update_data.py

      - name: Fetch official INSEE data
        run: python scripts/update_insee_data.py

      - name: Commit changed map data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schools.json data/iris_community.json data/iris_housing.json data/iris_income.json
          git diff --cached --quiet || git commit -m 'Update Toulouse map data'
          git push
