name: Update Toulouse IPS data
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official education data
        run: python scripts/update_data.py
      - name: Commit changed JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schools.json
          git diff --cached --quiet || git commit -m 'Update Toulouse school IPS data'
          git push
